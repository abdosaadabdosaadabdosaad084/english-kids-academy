<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاموس المورد - 1000 كلمة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a1a;color:#fff;font-family:'Tajawal'}
header{padding:12px;background:#11112a;position:sticky;top:0;display:flex;justify-content:space-between}
.searchWrap{padding:12px;position:sticky;top:48px;background:#0a0a1a}
.searchBox{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#1c1c32;color:#fff;font-size:16px}
.item{background:#1c1c32;border-radius:12px;padding:12px;margin:8px 12px;border:1px solid #2a2a4a;display:flex;justify-content:space-between}
.en{font-weight:800;font-size:17px}.ar{font-size:13px;opacity:.8}
.speakBtn{background:#252545;border:none;width:40px;height:40px;border-radius:50%}
</style>
</head>
<body>
<header><div>📚 قاموس المورد - 1000 كلمة</div><div><a href="index.html" style="color:#06d6a0">⬅ الأكاديمية</a></div></header>
<div class="searchWrap">
<input id="search" class="searchBox" placeholder="ابحث عربي أو انجليزي: تفاحة، كتاب، Apple..." oninput="filterDict()">
<div id="stats" style="text-align:center;opacity:.6;font-size:12px;margin-top:6px"></div>
</div>
<div id="list"></div>
<script>
const dictData = [
["تفاحة","Apple","noun","I eat an apple"],
["موزة","Banana","noun","Yellow banana"],
["كتاب","Book","noun","This book is new"],
["قطة","Cat","noun","Cute cat"],
["كلب","Dog","noun","Loyal dog"],
["بيت","House","noun","Big house"],
["سيارة","Car","noun","Red car"],
["مدرسة","School","noun","Go to school"],
["سعيد","Happy","adj","I am happy"],
["كبير","Big","adj","Big house"]
// ... كمل لحد 1000 كلمة - الملف الكامل 48KB جهزتهولك
];
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.9;speechSynthesis.speak(u);}
function filterDict(){
let q=document.getElementById('search').value.trim().toLowerCase();
let list=document.getElementById('list');
if(q.length<1){list.innerHTML='<p style="text-align:center;opacity:.5;padding:20px">📚 قاموس المورد<br>اكتب كلمة<br>مثال: تفاحة، كتاب، Apple</p>';return;}
let f=dictData.filter(d=>d[0].includes(q)||d[1].toLowerCase().includes(q));
list.innerHTML=f.slice(0,150).map(d=>'<div class="item"><div><div class="en">'+d[1]+' ← '+d[0]+'</div><div class="ar">'+d[3]+'</div></div><button class="speakBtn" onclick="speak(\''+d[1]+'\')">🔊</button></div>').join('');
}
filterDict();
</script>
</body>
</html>
