<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القواعد - شرح بالتفصيل الممل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0f0e2e;color:#fff;padding:10px}
.app{max-width:480px;margin:auto}
h1{text-align:center;font-size:26px;margin:8px 0}
.sub{text-align:center;color:#facc15;font-size:13px;margin-bottom:10px}
.top{display:flex;gap:6px;margin:10px 0}
.top button{flex:1;background:#1e1b4b;color:#fff;border:2px solid #facc15;padding:10px;border-radius:10px;font-weight:900;cursor:pointer}
.top button.active{background:#facc15;color:#000}
.card{background:#fff;color:#111;border-radius:14px;padding:14px;margin:10px 0;line-height:1.8}
.card h3{font-size:19px;margin-bottom:6px}
.badge{background:#fef3c7;color:#92400e;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:800}
.badge2{background:#dbeafe;color:#1e40af;padding:3px 8px;border-radius:6px;font-size:12px}
.ex{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin:6px 0}
.note{background:#fef3c7;padding:8px;border-radius:8px;margin:6px 0}
.err{background:#fee2e2;padding:8px;border-radius:8px;margin:6px 0}
.q{background:#ecfdf5;border:2px solid #16a34a;border-radius:10px;padding:10px;margin:8px 0}
.btn{background:#6366f1;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:800;cursor:pointer;margin:3px}
.btnG{background:#16a34a;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:800;cursor:pointer;margin:3px}
.opt{display:block;width:100%;text-align:right;background:#fff;border:2px solid #ddd;padding:10px;border-radius:10px;margin:5px 0;font-weight:800;cursor:pointer;font-family:'Cairo'}
</style>
</head>
<body>
<div class="app">
<h1>📚 مرجع القواعد</h1>
<p class="sub">شرح بالتفصيل الممل - ازاي وليه وامتى</p>
<div class="top">
<button id="b1" class="active" onclick="showTab('tenses')">⏰ الـ 12 زمن</button>
<button id="b2" onclick="showTab('basic')">🔤 أساسيات</button>
<button id="b3" onclick="showTab('pro')">🚀 احتراف</button>
</div>
<div id="box"></div>
</div>
<script>
function speakEn(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.75;speechSynthesis.speak(u);}
function speakAr(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=0.85;speechSynthesis.speak(u);}
const tenses=[
{title:'1 - Present Simple | المضارع البسيط',use:'عادات وحقائق كل يوم',form:'I/You/We/They + V1 | He/She/It + Vs',neg:'do not / does not + V1',ques:'Do / Does + فاعل + V1 ؟',keys:'always, usually, every day, often, never',ex:['I go to school every day = أذهب للمدرسة كل يوم','She plays football on Fridays = هي تلعب كرة قدم أيام الجمعة','The sun rises in the east = الشمس تشرق من الشرق - حقيقة','Water boils at 100 degrees = الماء يغلي عند 100 درجة'],note:'أهم زمن، 70% من الكلام. مع he/she/it لازم تضيف s للفعل.',err:'❌ غلط: She go to school. ✅ صح: She goes to school.',q:'اختر الصح: She ___ to school every day.',opts:['go','goes','going'],ans:'goes'},
{title:'2 - Past Simple | الماضي البسيط',use:'حدث خلص في الماضي وانتهى',form:'فاعل + V2 - went / ate / saw / played',neg:'did not + V1',ques:'Did + فاعل + V1 ؟',keys:'yesterday, ago, last week, last year, in 2020',ex:['I went to Cairo yesterday = ذهبت للقاهرة أمس','He ate an apple = أكل تفاحة','She studied English last year = درست إنجليزية السنة الماضية'],note:'لو الفعل منتظم بنضيف ed، لو شاذ بنحفظ تصريفه.',err:'❌ غلط: I goed. ✅ صح: I went.',q:'اختر الصح: I ___ to Cairo yesterday.',opts:['go','went','gone'],ans:'went'},
{title:'3 - Future Simple | المستقبل البسيط',use:'قرار سريع أو تنبؤ أو وعد',form:'فاعل + will + V1',neg:'will not (won\'t) + V1',ques:'Will + فاعل + V1 ؟',keys:'tomorrow, next week, soon, will',ex:['I will travel tomorrow = سأسافر غدا','It will rain = ستمطر','I will help you = سأساعدك - وعد'],note:'will للقرار اللي بتاخده وانت بتتكلم.',err:'❌ غلط: I will travels. ✅ صح: I will travel.',q:'اختر الصح: I ___ help you.',opts:['will','wills','will to'],ans:'will'},
{title:'4 - Present Continuous | المضارع المستمر',use:'بيحصل دلوقتي حالا',form:'am / is / are + Ving',neg:'am/is/are + not + Ving',ques:'Am/Is/Are + فاعل + Ving ؟',keys:'now, at the moment, Look!, Listen!',ex:['I am writing now = أنا أكتب الآن','She is sleeping = هي نائمة الآن','They are playing = هم يلعبون الآن'],note:'I + am - He/She/It + is - You/We/They + are',err:'❌ غلط: I am write. ✅ صح: I am writing.',q:'اختر الصح: She ___ sleeping now.',opts:['is','are','am'],ans:'is'},
{title:'5 - Past Continuous | الماضي المستمر',use:'كان مستمر وقطعه حدث تاني',form:'was / were + Ving',neg:'was/were + not + Ving',ques:'Was/Were + فاعل + Ving ؟',keys:'while, when, at 8pm yesterday',ex:['I was sleeping when he came = كنت نائم عندما جاء','She was cooking at 7pm = كانت تطبخ الساعة 7'],note:'while + ماضي مستمر، when + ماضي بسيط',err:'❌ غلط: I was sleep. ✅ صح: I was sleeping.',q:'اختر الصح: I ___ sleeping when he came.',opts:['was','were','is'],ans:'was'},
{title:'6 - Future Continuous | المستقبل المستمر',use:'هيكون مستمر في وقت معين في المستقبل',form:'will be + Ving',neg:'will not be + Ving',ques:'Will + فاعل + be + Ving ؟',keys:'at 8pm tomorrow, this time tomorrow',ex:['I will be studying at 8pm tomorrow = سأكون أذاكر الساعة 8 بكرة','They will be playing = سيكونون يلعبون'],note:'بنستخدمه عشان نقول هنكون بنعمل ايه في وقت معين.',err:'❌ غلط: I will be study. ✅ صح: I will be studying.',q:'اختر الصح: I will be ___ at 8pm.',opts:['study','studying','studied'],ans:'studying'},
{title:'7 - Present Perfect | المضارع التام',use:'خلص حالا وله أثر دلوقتي',form:'have / has + V3',neg:'have/has + not + V3',ques:'Have/Has + فاعل + V3 ؟',keys:'just, already, yet, ever, never, recently',ex:['I have eaten = لقد أكلت - للتو','She has gone = لقد ذهبت','I have just finished = انتهيت للتو'],note:'have مع I/You/We/They - has مع He/She/It',err:'❌ غلط: I have eat. ✅ صح: I have eaten.',q:'اختر الصح: She has ___ .',opts:['go','went','gone'],ans:'gone'},
{title:'8 - Past Perfect | الماضي التام',use:'حدث حصل قبل حدث تاني في الماضي',form:'had + V3',neg:'had not + V3',ques:'Had + فاعل + V3 ؟',keys:'before, after, when, by the time',ex:['I had finished before he came = كنت خلصت قبل ما ييجي','She had studied before the exam = كانت ذاكرت قبل الامتحان'],note:'الحدث الأقدم = ماضي تام، والحدث الأحدث = ماضي بسيط',err:'❌ غلط: I had finish. ✅ صح: I had finished.',q:'اختر الصح: I had ___ before he came.',opts:['finish','finished','finishing'],ans:'finished'},
{title:'9 - Future Perfect | المستقبل التام',use:'هيكون خلص قبل وقت معين في المستقبل',form:'will have + V3',neg:'will not have + V3',ques:'Will + فاعل + have + V3 ؟',keys:'by tomorrow, by next year, by 2030',ex:['I will have finished by tomorrow = سأكون انتهيت بحلول بكرة','By 2030, I will have learned English = بحلول 2030 سأكون اتعلمت انجليزي'],note:'by = بحلول، مهمة جدا في الزمن ده',err:'❌ غلط: I will have finish. ✅ صح: I will have finished.',q:'اختر الصح: I will have ___ by tomorrow.',opts:['finish','finished','finishing'],ans:'finished'},
{title:'10 - Present Perfect Continuous | المضارع التام المستمر',use:'بدأ في الماضي ولسه مستمر لحد دلوقتي',form:'have/has been + Ving',neg:'have/has not been + Ving',ques:'Have/Has + فاعل + been + Ving ؟',keys:'since, for, all day, all morning',ex:['I have been studying since morning = بذاكر من الصبح ولسه بذاكر','She has been working for 2 hours = بتشتغل من ساعتين ولسه'],note:'since + نقطة بداية - for + مدة',err:'❌ غلط: I have been study. ✅ صح: I have been studying.',q:'اختر الصح: I have been ___ since morning.',opts:['study','studying','studied'],ans:'studying'},
{title:'11 - Past Perfect Continuous | الماضي التام المستمر',use:'كان مستمر قبل حدث تاني في الماضي',form:'had been + Ving',neg:'had not been + Ving',ques:'Had + فاعل + been + Ving ؟',keys:'for, since, before, when',ex:['I had been waiting for 2 hours when he came = كنت مستني ساعتين لما جه','She had been sleeping before the phone rang = كانت نايمة قبل ما التليفون يرن'],note:'بنركز على مدة الاستمرار قبل الحدث التاني',err:'❌ غلط: I had been wait. ✅ صح: I had been waiting.',q:'اختر الصح: I had been ___ for 2 hours.',opts:['wait','waiting','waited'],ans:'waiting'},
{title:'12 - Future Perfect Continuous | المستقبل التام المستمر',use:'هيكون مستمر لمدة معينة في المستقبل',form:'will have been + Ving',neg:'will not have been + Ving',ques:'Will + فاعل + have been + Ving ؟',keys:'for, by, by next year',ex:['By next year, I will have been learning for 3 years = بحلول السنة الجاية هكون بتعلم بقالي 3 سنين','I will have been working for 5 hours by 10pm = هكون شغال بقالي 5 ساعات على الساعة 10'],note:'أصعب زمن بس شكله سهل: will have been + Ving',err:'❌ غلط: I will have been learn. ✅ صح: I will have been learning.',q:'اختر الصح: I will have been ___ for 3 years.',opts:['learn','learning','learned'],ans:'learning'}
];
function renderTenses(){
 document.getElementById('box').innerHTML=tenses.map((g,i)=>`<div class="card"><h3>📌 ${g.title}</h3><span class="badge">الاستخدام: ${g.use}</span><br><br><b>✅ التكوين:</b> ${g.form}<br><b>❌ النفي:</b> ${g.neg}<br><b>❓ السؤال:</b> ${g.ques}<br><b>🔑 الكلمات الدالة:</b> <span class="badge2">${g.keys}</span><br><br><b>📝 أمثلة بالتفصيل:</b>${g.ex.map(e=>`<div class="ex">• ${e}</div>`).join('')}<div class="note"><b>💡 ملحوظة:</b> ${g.note}</div><div class="err"><b>${g.err}</b></div><div class="q"><b>✍️ اختبر نفسك:</b> ${g.q}<br>${g.opts.map(o=>`<button class="opt" onclick="if('${o}'==='${g.ans}'){this.style.background='#dcfce7';alert('✅ صح!')}else{this.style.background='#fee2e2';alert('❌ غلط - الصح: ${g.ans}')}">${o}</button>`).join('')}</div><br><button class="btn" onclick="speakEn('${g.title}')">🔊 نطق EN</button> <button class="btnG" onclick="speakAr('${g.title}')">🔊 شرح عربي</button></div>`).join('');
}
function renderBasic(){
 document.getElementById('box').innerHTML=`
 <div class="card"><h3>🔤 أساسيات - من الصفر</h3>
 <b>1- الضمائر:</b> I أنا / You انت / He هو / She هي / It لغير العاقل / We نحن / They هم<br><br>
 <b>2- a / an / the:</b><br>• a + كلمة بتبدأ بحرف ساكن: a book<br>• an + كلمة بتبدأ بحرف متحرك: an apple<br>• the + حاجة معروفة: the sun<br><br>
 <b>3- المفرد والجمع:</b><br>• book -> books - cat -> cats<br>• child -> children - man -> men - woman -> women<br>• box -> boxes - baby -> babies<br><br>
 <b>4- الملكية:</b><br>my كتابي / your كتابك / his كتابه / her كتابها / our كتابنا / their كتابهم<br><br>
 <b>5- حروف الجر:</b><br>• in + سنة وشهر: in 2020 / in May<br>• on + يوم: on Monday<br>• at + ساعة: at 8pm<br><br>
 <b>6- المقارنة:</b><br>• tall - taller - tallest<br>• big - bigger - biggest<br>• good - better - best<br><br>
 <b>7- السؤال:</b><br>What ايه؟ / Where فين؟ / When امتى؟ / Why ليه؟ / How ازاي؟ / Who مين؟
 </div>
 <div class="card"><h3>✍️ اختبر نفسك - أساسيات</h3>
 <div class="q">Plural of child? <button class="opt" onclick="alert('✅ صح!')">children</button><button class="opt" onclick="alert('❌ غلط')">childs</button></div>
 <div class="q">I was born ___ 2010. <button class="opt" onclick="alert('✅ صح!')">in</button><button class="opt" onclick="alert('❌ غلط')">on</button></div>
 </div>`;
}
function renderPro(){
 document.getElementById('box').innerHTML=`
 <div class="card"><h3>🚀 احتراف - If الشرطية</h3>
 <b>Zero:</b> If you heat water, it boils = لو سخنت الماء يغلي - حقيقة<br>
 <b>First:</b> If you study, you will pass = لو ذاكرت ستنجح - ممكن<br>
 <b>Second:</b> If I were you, I would go = لو كنت مكانك لذهبت - خيال<br>
 <b>Third:</b> If I had studied, I would have passed = لو كنت ذاكرت كنت نجحت - فات<br><br>
 <button class="btn" onclick="speakEn('If you study you will pass')">🔊 EN</button> <button class="btnG" onclick="speakAr('لو ذاكرت ستنجح')">🔊 عربي</button>
 </div>
 <div class="card"><h3>🚀 احتراف - المبني للمجهول Passive</h3>
 <b>Present:</b> The cake is made = الكيكة بتتعمل<br>
 <b>Past:</b> The cake was made = الكيكة اتعملت<br>
 <b>Future:</b> The cake will be made = الكيكة هتتعمل<br><br>
 <b>القاعدة:</b> be + V3
 </div>
 <div class="card"><h3>🚀 احتراف - الكلام المنقول Reported Speech</h3>
 He said: "I am happy" -> He said he was happy<br>
 She said: "I will go" -> She said she would go<br><br>
 <b>القاعدة:</b> بنرجع زمن ورا: Present -> Past / will -> would
 </div>
 <div class="card"><h3>🚀 احتراف - الأفعال الشاذة المهمة</h3>
 go - went - gone = يذهب<br>eat - ate - eaten = يأكل<br>see - saw - seen = يرى<br>come - came - come = يأتي<br>do - did - done = يفعل<br>make - made - made = يصنع<br>take - took - taken = يأخذ<br>give - gave - given = يعطي
 </div>`;
}
function showTab(t){
 document.getElementById('b1').classList.remove('active');document.getElementById('b2').classList.remove('active');document.getElementById('b3').classList.remove('active');
 if(t==='tenses'){document.getElementById('b1').classList.add('active');renderTenses();}
 if(t==='basic'){document.getElementById('b2').classList.add('active');renderBasic();}
 if(t==='pro'){document.getElementById('b3').classList.add('active');renderPro();}
}
renderTenses();
</script>
</body>
</html>
