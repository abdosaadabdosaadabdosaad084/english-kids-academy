<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Kids Academy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma}
body{background:#1a1c3d;color:white;min-height:100vh}
.header{background:#1e2145;padding:15px;text-align:center;position:relative}
.header h1{font-size:22px}
.star{position:absolute;left:15px;top:18px;color:gold;text-align:center}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px}
.nav button{background:#2a2d5a;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-size:13px}
.main{padding:12px}
.card{background:#2a2d5a;border-radius:16px;padding:12px;text-align:center}
.letter-title{font-size:20px;margin-bottom:10px;font-weight:bold}
.canvas-wrap{border:2px dashed #00e5c0;border-radius:15px;background:white;padding:4px}
canvas{width:100%;height:320px;background:white;border-radius:12px;touch-action:none;display:block}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{padding:14px;border:none;border-radius:14px;font-size:18px;font-weight:bold}
.btn-clear{background:#00d3a0;color:white}
.btn-next{background:#00bfa5;color:white}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.box{background:#fff;color:#000;border-radius:20px;padding:20px;width:100%;max-width:340px;text-align:center}
.box input{width:100%;padding:14px;border-radius:12px;border:2px solid #ddd;margin:12px 0;text-align:center;font-size:22px}
.box button{width:100%;padding:14px;border-radius:12px;border:none;background:#00b386;color:#fff;font-size:18px;font-weight:bold}
.emergency{background:#ff1744 !important;margin-top:12px}
</style>
</head>
<body>
<div id="license-overlay" class="overlay">
  <div class="box">
    <h3>🔑 تفعيل التطبيق</h3>
    <input id="license-input" placeholder="اكتب 9999">
    <button onclick="activateApp()">تفعيل ✅</button>
    <button class="emergency" onclick="localStorage.clear();location.reload()">🚨 فتح طوارئ</button>
  </div>
</div>

<div class="header">
  <div class="star">⭐<br><span id="stars-count">0</span></div>
  <h1>English Kids<br>Academy</h1>
</div>

<div class="nav">
  <button>abc الحروف</button><button>📚 القاموس</button><button>📖 القواعد</button>
  <button>💬 محادثات</button><button>📖 قصص</button><button>🎤 المترجم</button><button>🎮 اللعبة</button>
</div>

<div class="main">
  <div class="card">
    <div class="letter-title" id="letter-title">الحرف: A</div>
    <div class="canvas-wrap"><canvas id="letter-canvas"></canvas></div>
    <div class="btns">
      <button class="btn btn-clear" onclick="clearCanvas()">مسح</button>
      <button class="btn btn-next" onclick="nextLetter()">⏩ التالي</button>
    </div>
  </div>
</div>

<script>
const MASTER_KEY="9999";
let currentLetter='A';
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let ctx,canvas,isDrawing=false;

function isLicenseValid(c){c=c.toString().trim();if(c===MASTER_KEY||c==='1234')return true;if(c.startsWith('888'))return true;return false}
function checkActivation(){const a=localStorage.getItem('app_activated')==='true';document.getElementById('license-overlay').style.display=a?'none':'flex'}
function activateApp(){const code=document.getElementById('license-input').value.trim();if(isLicenseValid(code)){localStorage.setItem('app_activated','true');document.getElementById('license-overlay').style.display='none';initApp()}else{alert('جرب 9999')}}
function initApp(){canvas=document.getElementById('letter-canvas');ctx=canvas.getContext('2d');resizeCanvas();showLetter('A');setupDrawing();let s=localStorage.getItem('stars')||'0';document.getElementById('stars-count').innerText=s}
function resizeCanvas(){const rect=canvas.getBoundingClientRect();canvas.width=rect.width*2;canvas.height=320*2;canvas.style.width=rect.width+'px';canvas.style.height='320px';ctx.setTransform(1,0,0,1,0,0);ctx.scale(2,2)}
function showLetter(letter){if(!ctx)return;const w=canvas.width/2;const h=320;ctx.clearRect(0,0,w,h);ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,h);ctx.fillStyle='#E6E6E6';ctx.font='bold 180px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(letter,w/2/2,h/2);document.getElementById('letter-title').innerText='الحرف: '+letter;currentLetter=letter}
function clearCanvas(){showLetter(currentLetter)}
function nextLetter(){let i=letters.indexOf(currentLetter);i=(i+1)%letters.length;showLetter(letters[i]);let s=parseInt(localStorage.getItem('stars')||'0')+1;localStorage.setItem('stars',s);document.getElementById('stars-count').innerText=s}
function setupDrawing(){const getPos=e=>{const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};const start=e=>{isDrawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};const move=e=>{if(!isDrawing)return;const p=getPos(e);ctx.lineWidth=6;ctx.lineCap='round';ctx.strokeStyle='#000';ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};const end=()=>{isDrawing=false};canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',end);canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end)}
window.addEventListener('load',()=>{checkActivation();if(localStorage.getItem('app_activated')==='true')setTimeout(initApp,300)})
</script>
</body>
</html>
