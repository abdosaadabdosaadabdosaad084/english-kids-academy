<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Pro Academy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-icon">🎓</div><div><div>English Pro</div><div style="font-size:0.65rem;color:#94a3b8">Kids & Adults</div></div></div>
  <div class="mode-switch">
    <button id="mode-kids" class="mode-btn active" onclick="setMode('kids')">👶 صغار</button>
    <button id="mode-adults" class="mode-btn" onclick="setMode('adults')">👨 كبار</button>
  </div>
</div>
<div class="container">
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="scoreNum">0</div><div class="stat-label">🏆 نقاط</div></div>
    <div class="stat-card"><div class="stat-num" id="learnedNum">0</div><div class="stat-label">📚 تعلمت</div></div>
    <div class="stat-card"><div class="stat-num" id="totalNum">500</div><div class="stat-label">🎯 كلمة</div></div>
  </div>
  <div class="search-card">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
      <span id="modeLabel" style="font-weight:700;color:#fde047">وضع الأطفال 👶</span>
      <span class="badge badge-live" id="status">500 كلمة جاهزة ✅</span>
    </div>
    <div class="input-group">
      <input id="qInput" class="input" placeholder="اكتب: مكان، تلميذ، مدرسة..." onkeypress="if(event.key==='Enter') searchAndExplain()">
      <button class="search-btn" onclick="searchAndExplain()">🔍</button>
    </div>
    <div class="action-grid">
      <button class="btn btn-primary" onclick="searchAndExplain()">🔍 ابحث واشرح</button>
      <button class="btn btn-dark" onclick="startQuiz()">🎯 كويز</button>
    </div>
  </div>
  <div class="board">
    <div id="boardContent" style="text-align:center;padding:20px;">
      <div style="font-size:3rem;">🎓</div>
      <p style="margin:10px 0;font-weight:700;">أهلاً في الأكاديمية الاحترافية!</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;">
        <div class="game-card" onclick="quickSearch('مكان')">📍 مكان</div>
        <div class="game-card" onclick="quickSearch('تلميذ')">🧑‍🎓 تلميذ</div>
        <div class="game-card" onclick="quickSearch('مدرسة')">🏫 مدرسة</div>
        <div class="game-card" onclick="quickSearch('لعبة')">🧸 لعبة</div>
      </div>
    </div>
  </div>
</div>
<div class="bottom-nav">
  <button id="tab-home" class="nav-item active" onclick="switchTab('home')"><span class="nav-icon">🏠</span>الرئيسية</button>
  <button id="tab-games" class="nav-item" onclick="switchTab('games')"><span class="nav-icon">🎮</span>ألعاب</button>
  <button id="tab-fav" class="nav-item" onclick="switchTab('fav')"><span class="nav-icon">⭐</span>المفضلة</button>
</div>
<script src="app.js"></script>
</body></html>
