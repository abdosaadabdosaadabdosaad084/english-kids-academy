<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Kids Academy</title>
<style>
body{margin:0;background:#fff;color:#000;font-family:Tahoma;text-align:center}
h1{margin:20px 0 5px 0;font-size:28px}
.nav button{background:#1a1c3d;color:#fff;border:none;padding:10px 16px;border-radius:25px;margin:4px;font-size:14px}
#letter-canvas{background:#fff !important;border:3px dashed #00c8a0;border-radius:20px;width:90% !important;max-width:400px;height:380px !important;display:block;margin:15px auto}
.controls button{padding:10px 20px;border-radius:10px;border:1px solid #ccc;background:#fff;margin:5px;font-size:16px}
</style>
</head>
<body>
<h1>English Kids Academy</h1>
<div>⭐ <span id="stars">0</span></div>

<div class="nav">
<button>📚 القواعد بالتفصيل</button>
<button>📚 القاموس</button>
<button>🔤 الحروف abc</button>
<button>🎤 المترجم</button>
<button>📖 قصص مترجمة</button>
<button>💬 محادثات كتير</button>
<button>🎮 اللعبة</button>
</div>

<h2 id="title">الحرف: A</h2>
<canvas id="letter-canvas"></canvas>

<div class="controls">
<button onclick="speakLetter()">🔊 نطق</button>
<button onclick="nextLetter()" style="background:orange;color:#fff">⏩ التالي</button>
<button onclick="clearCanvas()">مسح</button>
</div>

<script>
let cur='A', letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), ctx, canvas;
function init(){
 canvas=document.getElementById('letter-canvas');
 ctx=canvas.getContext('2d');
 resize(); show(cur);
 canvas.addEventListener('touchstart',start,{passive:false});
 canvas.addEventListener('touchmove',move,{passive:false});
 canvas.addEventListener('touchend',()=>isDraw=false);
 canvas.addEventListener('mousedown',start);
 canvas.addEventListener('mousemove',move);
 window.addEventListener('mouseup',()=>isDraw=false);
}
function resize(){let r=canvas.getBoundingClientRect();canvas.width=r.width*2;canvas.height=380*2;ctx.scale(2,2);}
function show(l){
 cur=l; let w=canvas.width/2, h=380;
 ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#E0E0E0'; ctx.font='bold 200px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
 ctx.fillText(l,w/2/2,h/2);
 document.getElementById('title').innerText='الحرف: '+l;
}
let isDraw=false;
function getP(e){let r=canvas.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
function start(e){isDraw=true;let p=getP(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()}
function move(e){if(!isDraw)return;let p=getP(e);ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#000';ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}
function clearCanvas(){show(cur)}
function nextLetter(){let i=letters.indexOf(cur);i=(i+1)%letters.length;show(letters[i])}
function speakLetter(){let u=new SpeechSynthesisUtterance(cur);u.lang='en-US';speechSynthesis.speak(u)}
window.onload=init;
</script>
</body>
</html>
