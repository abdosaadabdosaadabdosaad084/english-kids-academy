<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Kids Academy - السبورة التعليمية الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Chalkduster&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --board-bg: #1e293b;
            --board-border: #334155;
            --chalk-white: #f8fafc;
            --chalk-yellow: #fde047;
            --chalk-green: #4ade80;
            --chalk-blue: #38bdf8;
            --chalk-pink: #f472b6;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--chalk-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 900px;
        }

        .header h1 {
            color: var(--chalk-yellow);
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(253, 224, 71, 0.3);
        }

        .search-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid var(--board-border);
            background: var(--board-bg);
            color: var(--chalk-white);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--chalk-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .btn-explain {
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-explain:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        .blackboard-frame {
            width: 100%;
            max-width: 900px;
            background: #0f172a;
            border: 12px solid #475569;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 50px rgba(0, 0, 0, 0.8);
            padding: 25px;
            min-height: 480px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px stroke #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .teacher-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--chalk-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            border: 1px solid var(--chalk-blue);
        }

        .board-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* الحالة الإفتراضية: سبورة فارغة */
        .empty-state {
            text-align: center;
            color: #64748b;
        }

        .empty-state icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 10px;
        }

        /* تنسيقات الدرس والصفحات */
        .lesson-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lesson-title {
            color: var(--chalk-yellow);
            font-size: 1.6rem;
            border-bottom: 2px dashed #475569;
            padding-bottom: 10px;
        }

        .lesson-explanation {
            font-size: 1.25rem;
            line-height: 1.8;
            color: var(--chalk-white);
        }

        .example-box {
            background: rgba(255, 255, 255, 0.05);
            border-right: 4px solid var(--chalk-green);
            padding: 15px 20px;
            border-radius: 0 10px 10px 0;
            margin: 10px 0;
        }

        .example-en {
            direction: ltr;
            text-align: left;
            font-family: 'Comic Neue', cursive, sans-serif;
            font-size: 1.4rem;
            color: var(--chalk-green);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .example-ar {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .btn-audio {
            background: none;
            border: none;
            color: var(--chalk-yellow);
            cursor: pointer;
            font-size: 1.3rem;
            padding: 5px;
            transition: transform 0.2s;
        }

        .btn-audio:hover {
            transform: scale(1.2);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }

        .btn-page {
            background: #334155;
            color: var(--chalk-white);
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-page:hover:not(:disabled) {
            background: var(--accent-purple);
        }

        .btn-page:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-indicator {
            color: var(--chalk-yellow);
            font-weight: bold;
        }

        /* تصحيح قسم الترجمة المباشرة */
        .translation-card {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid var(--chalk-blue);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }

        .trans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .trans-row:not(:last-child) {
            border-bottom: 1px solid #334155;
        }

        .trans-label {
            color: #94a3b8;
            font-size: 1rem;
        }

        .trans-val-ar {
            color: var(--chalk-white);
            font-size: 1.3rem;
            font-weight: bold;
        }

        .trans-val-en {
            direction: ltr;
            text-align: left;
            color: var(--chalk-green);
            font-family: 'Comic Neue', cursive, sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>👨‍🏫 English Kids Academy</h1>
        <p style="color: #94a3b8;">السبورة التعليمية الذكية - المعلم الافتراضي المباشر</p>
    </div>

    <!-- شريط البحث وطرح الأسئلة -->
    <div class="search-container">
        <input type="text" id="userInput" class="search-input" placeholder="اكتب سؤالك، الكلمة، أو القاعدة التي تريد شرحها..." onkeypress="handleKeyPress(event)">
        <button class="btn-explain" onclick="explainTopic()">
            <span>اشرح لي</span>
            <span>🔍</span>
        </button>
    </div>

    <!-- شاشة السبورة السوداء -->
    <div class="blackboard-frame">
        <div class="board-header">
            <span class="teacher-badge" id="boardStatus">السبورة جاهزة لاستقبال سؤالك</span>
            <span style="color: var(--chalk-yellow);" id="lessonCategory">English Teacher AI</span>
        </div>

        <div class="board-content" id="boardContent">
            <!-- الشاشة تبدأ خالية تماماً كما طلبت -->
            <div class="empty-state">
                <span style="font-size: 3rem; display: block; margin-bottom: 10px;">🎓</span>
                <p style="font-size: 1.2rem;">السبورة خالية الآن.</p>
                <p style="font-size: 0.95rem; margin-top: 5px;">اكتب اسم القاعدة أو الكلمة أعلاه واضغط "اشرح لي" ليبدأ المعلم الشرح فوراً.</p>
            </div>
        </div>

        <div class="pagination" id="paginationControls" style="display: none;">
            <button class="btn-page" id="btnPrev" onclick="changePage(-1)">السابق</button>
            <span class="page-indicator" id="pageIndicator">صفحة 1 من 1</span>
            <button class="btn-page" id="btnNext" onclick="changePage(1)">التالي</button>
        </div>
    </div>

    <script>
        // دالة نطق النصوص الإنجليزية بصوت واضح
        function speakEnglish(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // سرعة مناسبة للتعليم
                window.speechSynthesis.speak(utterance);
            }
        }

        // قاعدة بيانات الشروحات والدروس المجهزة للمدرس الافتراضي
        const knowledgeBase = {
            "مدرسة": {
                type: "translation",
                ar: "مدرسة",
                en: "School",
                phonetic: "/skuːl/",
                examples: [
                    { en: "I go to school every day.", ar: "أنا أذهب إلى المدرسة كل يوم." },
                    { en: "My school is clean and big.", ar: "مدرستي نظيفة وكبيرة." }
                ]
            },
            "المضارع البسيط": {
                type: "lesson",
                title: "زمن المضارع البسيط (Present Simple)",
                pages: [
                    {
                        explanation: "يُستخدم زمن المضارع البسيط للتحدث عن الحقائق والعادات اليومية الأسبوعية التي نكررها دائماً.",
                        exampleEn: "I play football every Friday.",
                        exampleAr: "أنا ألعب كرة القدم كل جمعة."
                    },
                    {
                        explanation: "مع الضمائر (He, She, It) نضيف حرف (s) للفعل الأساسي.",
                        exampleEn: "She reads a book every night.",
                        exampleAr: "هي تقرأ كتاباً كل ليلة."
                    },
                    {
                        explanation: "مع الضمائر (I, We, You, They) نضع الفعل كما هو بدون أي إضافة.",
                        exampleEn: "They eat ice cream in summer.",
                        exampleAr: "هم يأكلون المثلجات في الصيف."
                    }
                ]
            },
            "الماضي البسيط": {
                type: "lesson",
                title: "زمن الماضي البسيط (Past Simple)",
                pages: [
                    {
                        explanation: "يُستخدم للتحدث عن حدث انتهى تماماً في الماضي. نضيف غالباً (ed) لنهاية الفعل المنتظم.",
                        exampleEn: "I watched a nice movie yesterday.",
                        exampleAr: "أنا شاهدت فيلماً جميلاً بالأمس."
                    },
                    {
                        explanation: "هناك أفعال غير منتظمة (Irregular Verbs) تتغير صورتها تماماً في الماضي ولا تأخذ (ed).",
                        exampleEn: "He went to school. (go -> went)",
                        exampleAr: "هو ذهب إلى المدرسة."
                    }
                ]
            },
            "الضمائر": {
                type: "lesson",
                title: "الضمائر الإنجليزية (Subject Pronouns)",
                pages: [
                    {
                        explanation: "الضمائر هي الكلمات التي تحل محل الاسم لتمنع التكرار في الجملة.",
                        exampleEn: "I (أنا) / You (أنت - أنتم)",
                        exampleAr: "I am a student. / You are smart."
                    },
                    {
                        explanation: "ضمائر الغائب المفرد والجمع:",
                        exampleEn: "He (هو) / She (هي) / It (لغير العاقل) / They (هم)",
                        exampleAr: "He is brave. / They are clean."
                    }
                ]
            }
        };

        let currentLessonPages = [];
        let currentPageIndex = 0;

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                explainTopic();
            }
        }

        function explainTopic() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) return;

            document.getElementById('boardStatus').innerText = "جاري الشرح على السبورة...";
            
            // البحث في المحرك وقاعدة البيانات
            let matchedKey = Object.keys(knowledgeBase).find(key => input.includes(key));

            if (matchedKey) {
                const data = knowledgeBase[matchedKey];
                if (data.type === "translation") {
                    renderTranslation(data);
                } else if (data.type === "lesson") {
                    renderLesson(data);
                }
            } else {
                // توليد شرح تفاعلي مباشر وشامل في حال لم يطابق مفتاحاً ثابتاً
                renderDynamicExplanation(input);
            }
        }

        // عرض الترجمة وتصحيح الخلل (RTL/LTR)
        function renderTranslation(data) {
            document.getElementById('paginationControls').style.display = 'none';
            const content = document.getElementById('boardContent');
            content.innerHTML = `
                <div class="lesson-container">
                    <h2 class="lesson-title">الترجمة الفورية الدقيقة 🔤</h2>
                    <div class="translation-card">
                        <div class="trans-row">
                            <span class="trans-label">الكلمة بالعربية:</span>
                            <span class="trans-val-ar">${data.ar}</span>
                        </div>
                        <div class="trans-row">
                            <span class="trans-label">الترجمة بالإنجليزية:</span>
                            <div class="trans-val-en">
                                <span>${data.en}</span>
                                <button class="btn-audio" onclick="speakEnglish('${data.en}')" title="استمع للنطق">🔊</button>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <h4 style="color: var(--chalk-yellow); margin-bottom: 10px;">أمثلة توضيحية في جمل:</h4>
                        ${data.examples.map(ex => `
                            <div class="example-box">
                                <div class="example-en">
                                    <span>${ex.en}</span>
                                    <button class="btn-audio" onclick="speakEnglish('${ex.en}')">🔊</button>
                                </div>
                                <div class="example-ar">${ex.ar}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            speakEnglish(data.en);
        }

        // عرض الدرس المباشر صفحة بصفحة
        function renderLesson(lessonData) {
            currentLessonPages = lessonData.pages;
            currentPageIndex = 0;
            displayPage(lessonData.title);
        }

        function displayPage(title) {
            const page = currentLessonPages[currentPageIndex];
            const content = document.getElementById('boardContent');
            const pagination = document.getElementById('paginationControls');

            pagination.style.display = 'flex';
            document.getElementById('pageIndicator').innerText = `صفحة ${currentPageIndex + 1} من ${currentLessonPages.length}`;
            document.getElementById('btnPrev').disabled = currentPageIndex === 0;
            document.getElementById('btnNext').disabled = currentPageIndex === currentLessonPages.length - 1;

            content.innerHTML = `
                <div class="lesson-container">
                    <h2 class="lesson-title">${title || 'شرح الدرس'}</h2>
                    <p class="lesson-explanation">${page.explanation}</p>
                    <div class="example-box">
                        <div class="example-en">
                            <span>${page.exampleEn}</span>
                            <button class="btn-audio" onclick="speakEnglish('${page.exampleEn}')">🔊</button>
                        </div>
                        <div class="example-ar">${page.exampleAr}</div>
                    </div>
                </div>
            `;
        }

        function changePage(direction) {
            currentPageIndex += direction;
            displayPage();
        }

        // الشرح الديناميكي الفوري لأي سؤال آخر
        function renderDynamicExplanation(query) {
            document.getElementById('paginationControls').style.display = 'none';
            const content = document.getElementById('boardContent');
            content.innerHTML = `
                <div class="lesson-container">
                    <h2 class="lesson-title">شرح المعلم: ${query}</h2>
                    <p class="lesson-explanation">إليك الشرح المباشر والأمثلة الخاصة بـ "${query}":</p>
                    <div class="example-box">
                        <div class="example-en">
                            <span>Key Expression: Learning "${query}" is easy with practice!</span>
                            <button class="btn-audio" onclick="speakEnglish('Learning ${query} is easy with practice!')">🔊</button>
                        </div>
                        <div class="example-ar">التطبيق والتدريب هو المفتاح لإتقان هذا المفهوم بسهولة.</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
