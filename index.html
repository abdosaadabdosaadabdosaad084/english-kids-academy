<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعلم الإنجليزية الاحترافي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <header>
        <h1>نظام تعليم الإنجليزية الذكي 🎓</h1>
        <p>رحلتك من الصفر إلى الاحتراف</p>
    </header>

    <main>
        <!-- قسم اختيار المستويات -->
        <section class="levels-container">
            <button class="level-btn active" onclick="switchLevel('kids')">🧒 مرحلة البراعم (الأطفال)</button>
            <button class="level-btn" onclick="switchLevel('beginners')">🌱 المبتدئين (الشباب)</button>
            <button class="level-btn" onclick="switchLevel('advanced')">🚀 المحادثة والاحتراف</button>
        </section>

        <!-- منطقة عرض المحتوى التعليمي -->
        <section class="content-card">
            <div id="content-display">
                <!-- يتم توليد المحتوى هنا عبر الـ JavaScript -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        // تسجيل الـ Service Worker لتشغيل التطبيق بدون إنترنت
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
