<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Kids Academy</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;margin:0;padding:16px}
.screen{display:none}.screen.active{display:block}
button{padding:12px 16px;border:0;border-radius:12px;margin:6px;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1e293b;padding:16px;border-radius:16px;text-align:center}
#lettersRow,#numbersRow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#lettersRow div,#numbersRow div{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:800;color:white;cursor:pointer}
#learnLetter{font-size:90px;text-align:center;font-weight:900}
input,textarea{width:100%;padding:12px;border-radius:12px;border:0;box-sizing:border-box;margin:8px 0}
#options button{display:block;width:100%;margin:6px 0}
.correct{background:#22c55e!important}.wrong{background:#ef4444!important;color:white}
#barFill{height:10px;background:#22c55e;border-radius:10px}
.hint-text{opacity:.7}.welcome-text{font-size:22px}
</style>
</head>
<body>

<div id="homeScreen" class="screen active">
<h1>🌟 English Kids Academy</h1>
<div class="grid">
<div class="card" onclick="openScreen('learnScreen')">🔤<br>تعلم الحروف</div>
<div class="card" onclick="openScreen('aiScreen')">🤖<br>المساعد الذكي</div>
<div class="card" onclick="openScreen('transScreen')">🌐<br>الترجمة</div>
<div class="card" onclick="openScreen('quizScreen')">🎮<br>التحدي</div>
<div class="card" onclick="openScreen('videosScreen');loadVideos()">🎬<br>فيديوهات</div>
</div>
</div>

<div id="learnScreen" class="screen">
<h2>🔤 تعلم الحروف والأرقام</h2>
<div id="learnLetter"></div>
<button onclick="speakLearn()">🔊 اسمع</button>
<button onclick="nextLearn()">التالي ➡</button>
<button onclick="clearLearn()">مسح</button>
<h3>الحروف</h3><div id="lettersRow"></div>
<h3>الأرقام</h3><div id="numbersRow"></div>
<button onclick="openScreen('homeScreen')">⬅ رجوع</button>
</div>

<div id="aiScreen" class="screen">
<h2>🤖 المساعد الذكي</h2>
<input id="aiSearch" placeholder="اكتب أي كلمة...">
<button onclick="searchAI()">بحث</button>
<button onclick="startVoice('aiSearch')">🎤</button>
<button onclick="nextAI()">كلمة عشوائية</button>
<button onclick="clearAI()">مسح</button>
<div id="aiBoardContent"><p class="welcome-text">👋 أهلا يا بطل!</p><p class="hint-text">اكتب أي كلمة فوق</p></div>
<button onclick="openScreen('homeScreen')">⬅ رجوع</button>
</div>

<div id="transScreen" class="screen">
<h2>🌐 الترجمة</h2>
<div><span id="fromLang">العربية</span> ➡ <span id="toLang">English</span> <button onclick="swapLang()">🔄 تبديل</button></div>
<textarea id="transInput" oninput="autoTranslate()" placeholder="اكتب هنا..."></textarea>
<p id="transOutput">الترجمة ستظهر هنا...</p>
<button onclick="startVoice('transInput')">🎤</button>
<button onclick="copyTrans()">نسخ</button>
<button onclick="clearTrans()">مسح</button>
<button onclick="openScreen('homeScreen')">⬅ رجوع</button>
</div>

<div id="quizScreen" class="screen">
<h2>🎮 التحدي</h2>
<p id="score">النقاط: 0</p>
<p id="progressText"></p>
<div style="background:#334155;border-radius:10px"><div id="barFill"></div></div>
<div id="questionCard" style="font-size:22px;margin:16px 0"></div>
<div id="options"></div>
<button onclick="resetGame()">🔄 من جديد</button>
<button onclick="openScreen('homeScreen')">⬅ رجوع</button>
</div>

<div id="videosScreen" class="screen">
<h2>🎬 فيديوهات</h2>
<div id="videosList"><p>جاري تحميل الفيديوهات...</p></div>
<button onclick="openScreen('homeScreen')">⬅ رجوع</button>
</div>

<script src="app.js"></script>
</body>
</html>
