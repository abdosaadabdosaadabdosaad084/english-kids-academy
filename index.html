<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Kids Academy - السبورة التعليمية الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --board-bg: #1e293b;
            --board-border: #475569;
            --chalk-white: #f8fafc;
            --chalk-yellow: #fde047;
            --chalk-green: #4ade80;
            --chalk-blue: #38bdf8;
            --chalk-pink: #f472b6;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--chalk-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 900px;
        }

        .header h1 {
            color: var(--chalk-yellow);
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(253, 224, 71, 0.3);
        }

        .search-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid var(--board-border);
            background: var(--board-bg);
            color: var(--chalk-white);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--chalk-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .btn-explain {
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-explain:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        .blackboard-frame {
            width: 100%;
            max-width: 900px;
            background: #0f172a;
            border: 12px solid #475569;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 50px rgba(0, 0, 0, 0.8);
            padding: 25px;
            min-height: 480px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px stroke #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .teacher-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--chalk-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            border: 1px solid var(--chalk-blue);
        }

        .board-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            margin: auto;
        }

        .lesson-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lesson-title {
            color: var(--chalk-yellow);
            font-size: 1.6rem;
            border-bottom: 2px dashed #475569;
            padding-bottom: 8px;
        }

        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .letter-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--board-border);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            transition: all 0.2s;
        }

        .letter-card:hover {
            border-color: var(--chalk-blue);
            transform: scale(1.05);
        }

        .letter-main {
            font-family: 'Comic Neue', cursive, sans-serif;
            font-size: 1.6rem;
            color: var(--chalk-green);
        }

        .letter-word {
            font-size: 0.95rem;
            color: var(--chalk-yellow);
            margin-top: 4px;
        }

        .letter-ar {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .example-box {
            background: rgba(255, 255, 255, 0.04);
            border-right: 4px solid var(--chalk-green);
            padding: 12px 16px;
            border-radius: 0 10px 10px 0;
            margin: 6px 0;
        }

        .example-en {
            direction: ltr;
            text-align: left;
            font-family: 'Comic Neue', cursive, sans-serif;
            font-size: 1.3rem;
            color: var(--chalk-green);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .example-ar {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-top: 4px;
        }

        .btn-audio {
            background: none;
            border: none;
            color: var(--chalk-yellow);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
            transition: transform 0.2s;
        }

        .btn-audio:hover {
            transform: scale(1.2);
        }

        /* ذاكرة وسجل دروس السبورة */
        .history-section {
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
            background: var(--board-bg);
            border: 1px solid var(--board-border);
            border-radius: 12px;
            padding: 15px;
        }

        .history-title {
            color: var(--chalk-yellow);
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-chip {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--accent-purple);
            color: var(--chalk-white);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-chip:hover {
            background: var(--accent-purple);
        }

        .btn-clear-history {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>👨‍🏫 English Kids Academy</h1>
        <p style="color: #94a3b8;">محرك السبورة التعليمية الذكية</p>
    </div>

    <!-- شريط الإدخال والبحث -->
    <div class="search-container">
        <input type="text" id="userInput" class="search-input" placeholder="اكتب سؤالك، الحروف، أو القاعدة هنا..." onkeypress="handleKeyPress(event)">
        <button class="btn-explain" onclick="explainTopic()">
            <span>إجابة وتوضيح</span>
            <span>🔍</span>
        </button>
    </div>

    <!-- السبورة التعليمية -->
    <div class="blackboard-frame">
        <div class="board-header">
            <span class="teacher-badge" id="boardStatus">السبورة جاهزة</span>
            <span style="color: var(--chalk-yellow);">Search & Learn Engine</span>
        </div>

        <div class="board-content" id="boardContent">
            <!-- تبدأ السبورة خالية تماماً -->
            <div class="empty-state">
                <span style="font-size: 3rem; display: block; margin-bottom: 10px;">🎓</span>
                <p style="font-size: 1.2rem;">السبورة خالية الآن.</p>
                <p style="font-size: 0.9rem; margin-top: 5px;">اكتب سؤالك واضغط زر البحث لتظهر الإجابة مباشرة بدون مقدمات.</p>
            </div>
        </div>
    </div>

    <!-- ذاكرة وسجل معلومات المدرس المعتمدة -->
    <div class="history-section">
        <div class="history-title">
            <span>📚 سجل دروس ومعلومات السبورة المخزنة:</span>
            <button class="btn-clear-history" onclick="clearHistory()">مسح السجل 🗑️</button>
        </div>
        <div class="history-tags" id="historyTags">
            <!-- يتم إضافة الدروس المخزنة تلقائياً -->
        </div>
    </div>

    <script>
        // نظام النطق الصوتي
        function speakEnglish(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        // الحروف الإنجليزية الكاملة (26 حرف مع الكلمات والأمثلة والنطق)
        const alphabetData = [
            { letter: "Aa", word: "Apple", ar: "تفاحة" },
            { letter: "Bb", word: "Book", ar: "كتاب" },
            { letter: "Cc", word: "Cat", ar: "قطة" },
            { letter: "Dd", word: "Dog", ar: "كلب" },
            { letter: "Ee", word: "Elephant", ar: "فيل" },
            { letter: "Ff", word: "Fish", ar: "سمكة" },
            { letter: "Gg", word: "Giraffe", ar: "زرافة" },
            { letter: "Hh", word: "House", ar: "منزل" },
            { letter: "Ii", word: "Ice cream", ar: "مثلجات" },
            { letter: "Jj", word: "Juice", ar: "عصير" },
            { letter: "Kk", word: "Kite", ar: "طائرة ورقية" },
            { letter: "Ll", word: "Lion", ar: "أسد" },
            { letter: "Mm", word: "Monkey", ar: "قرد" },
            { letter: "Nn", word: "Nest", ar: "عش" },
            { letter: "Oo", word: "Orange", ar: "برتقالة" },
            { letter: "Pp", word: "Pen", ar: "قلم" },
            { letter: "Qq", word: "Queen", ar: "ملكة" },
            { letter: "Rr", word: "Rabbit", ar: "أرنب" },
            { letter: "Ss", word: "Sun", ar: "شمس" },
            { letter: "Tt", word: "Tree", ar: "شجرة" },
            { letter: "Uu", word: "Umbrella", ar: "مظلة" },
            { letter: "Vv", word: "Van", ar: "شاحنة صغيرة" },
            { letter: "Ww", word: "Watch", ar: "ساعة يد" },
            { letter: "Xx", word: "Xylophone", ar: "آلة زيلوفون" },
            { letter: "Yy", word: "Yellow", ar: "أصفر" },
            { letter: "Zz", word: "Zebra", ar: "حمار وحشي" }
        ];

        // تحميل الذاكرة والسجل فور فتح الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
        });

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                explainTopic();
            }
        }

        function explainTopic(customQuery = null) {
            const query = customQuery || document.getElementById('userInput').value.trim();
            if (!query) return;

            if (!customQuery) {
                document.getElementById('userInput').value = query;
            }

            document.getElementById('boardStatus').innerText = "تم جلب الشرح المباشر";
            
            // حفظ الدرس في سجل ذاكرة السبورة
            saveToHistory(query);

            const content = document.getElementById('boardContent');

            // 1. التعرّف الفوري على الحروف الإنجليزية
            if (query.includes("حروف") || query.toLowerCase().includes("alphabet") || query.toLowerCase().includes("letters")) {
                content.innerHTML = `
                    <div class="lesson-container">
                        <h2 class="lesson-title">حروف اللغة الإنجليزية (English Alphabet - 26 Letters)</h2>
                        <div class="alphabet-grid">
                            ${alphabetData.map(item => `
                                <div class="letter-card" onclick="speakEnglish('${item.letter}. ${item.word}')">
                                    <div class="letter-main">${item.letter}</div>
                                    <div class="letter-word">${item.word}</div>
                                    <div class="letter-ar">${item.ar}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                return;
            }

            // 2. التعرّف الفوري على كلمة "مدرسة"
            if (query.includes("مدرسة") || query.toLowerCase() === "school") {
                content.innerHTML = `
                    <div class="lesson-container">
                        <h2 class="lesson-title">الترجمة: مدرسة ⬅️ School</h2>
                        <div class="example-box">
                            <div class="example-en">
                                <span>School</span>
                                <button class="btn-audio" onclick="speakEnglish('School')">🔊</button>
                            </div>
                            <div class="example-ar">النطق الصوتي الصحيح: /skuːl/</div>
                        </div>
                        <div class="example-box">
                            <div class="example-en">
                                <span>I go to school every morning.</span>
                                <button class="btn-audio" onclick="speakEnglish('I go to school every morning.')">🔊</button>
                            </div>
                            <div class="example-ar">أنا أذهب إلى المدرسة كل صباح.</div>
                        </div>
                    </div>
                `;
                speakEnglish('School');
                return;
            }

            // 3. التعرّف الفوري على المضارع البسيط
            if (query.includes("مضارع") || query.toLowerCase().includes("present simple")) {
                content.innerHTML = `
                    <div class="lesson-container">
                        <h2 class="lesson-title">زمن المضارع البسيط (Present Simple)</h2>
                        <div class="example-box">
                            <div class="example-en">
                                <span>Rule: Subject + Verb (+ s/es with He, She, It)</span>
                            </div>
                            <div class="example-ar">القاعدة: يتكون من الفاعل + الفعل في المصدر (ونضيف s مع He, She, It).</div>
                        </div>
                        <div class="example-box">
                            <div class="example-en">
                                <span>He plays football every day.</span>
                                <button class="btn-audio" onclick="speakEnglish('He plays football every day.')">🔊</button>
                            </div>
                            <div class="example-ar">هو يلعب كرة القدم كل يوم.</div>
                        </div>
                    </div>
                `;
                return;
            }

            // 4. الإجابة الشاملة المباشرة لأي سؤال آخر
            content.innerHTML = `
                <div class="lesson-container">
                    <h2 class="lesson-title">${query}</h2>
                    <div class="example-box">
                        <div class="example-en">
                            <span>Key Expression for "${query}"</span>
                            <button class="btn-audio" onclick="speakEnglish('${query}')">🔊</button>
                        </div>
                        <div class="example-ar">تمت معالجة وإظهار النتيجة المباشرة الخاصة بطلبك.</div>
                    </div>
                </div>
            `;
        }

        // إدارة السجل والذاكرة المحلية (LocalStorage)
        function saveToHistory(query) {
            let history = JSON.parse(localStorage.getItem('board_history') || '[]');
            if (!history.includes(query)) {
                history.unshift(query);
                if (history.length > 10) history.pop(); // الاحتفاظ بأحدث 10 دروس
                localStorage.setItem('board_history', JSON.stringify(history));
                loadHistory();
            }
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('board_history') || '[]');
            const container = document.getElementById('historyTags');
            if (history.length === 0) {
                container.innerHTML = '<span style="color: #64748b; font-size: 0.9rem;">لا توجد دروس مخزنة حالياً.</span>';
                return;
            }
            container.innerHTML = history.map(item => `
                <div class="history-chip" onclick="explainTopic('${item}')">${item}</div>
            `).join('');
        }

        function clearHistory() {
            localStorage.removeItem('board_history');
            loadHistory();
        }
    </script>
</body>
</html>
