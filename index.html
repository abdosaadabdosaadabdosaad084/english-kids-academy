<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Kids Academy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06d6a0">
<style>
body{background:#0a0a1a;color:#fff;font-family:sans-serif;margin:0;padding:15px}
h1{text-align:center}
.card{background:#1e1e3a;padding:20px;margin:12px 0;border-radius:15px;text-align:center;font-size:18px}
button{background:#06d6a0;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;width:100%;margin-top:10px}
.install-banner{background:#06d6a0;color:#000;padding:15px;border-radius:12px;text-align:center;font-weight:bold;display:block;margin:10px 0}
</style>
</head>
<body>
<h1>English Kids Academy</h1>

<div id="installDiv" class="install-banner" style="display:none">
📱 دوس هنا لتثبيت التطبيق على هاتفك
</div>

<div class="card" onclick="speak('abc')">🔤 الحروف والسبورة<br><small>abc</small></div>
<div class="card">📚 القاموس الشامل (بحث جوجل)<br><input id="search" placeholder="اكتب كلمة انجليزية" style="width:90%;padding:8px;border-radius:8px"><button onclick="searchDict()">بحث</button></div>
<div class="card">📖 القواعد بالتفصيل الممل</div>
<div class="card" onclick="startVoice()">🎤 الترجمة الفورية - دوس وتكلم</div>
<div id="result" class="card" style="display:none"></div>

<script>
let deferredPrompt;
const installDiv = document.getElementById('installDiv');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installDiv.style.display = 'block';
});
installDiv.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    installDiv.style.display = 'none';
  }
});

function speak(t){ speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
function searchDict(){
  let w=document.getElementById('search').value;
  if(w) window.open('https://www.google.com/search?q='+w+' meaning','_blank');
}
function startVoice(){
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang='ar-EG'; rec.start();
  rec.onresult = (e)=>{
    let txt=e.results[0][0].transcript;
    document.getElementById('result').style.display='block';
    document.getElementById('result').innerText='سمعت: '+txt;
    speak(txt);
  }
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
