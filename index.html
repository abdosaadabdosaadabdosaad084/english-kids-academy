<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Pro Academy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1b4b">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top-bar">
  <div class="logo"><span>🎓</span><div><b>English Pro</b><small>Smart Academy</small></div></div>
  <button id="installBtn" class="install-btn">📲 ثبّت التطبيق</button>
</header>

<main class="one-page">
<!-- السبورة -->
<section class="section-card">
  <h2>📚 السبورة الذكية</h2>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="اسأل السبورة... النمر، تعالى، cat" />
    <button id="searchBtn">🔍</button>
    <button id="voiceBtn">🎤</button>
  </div>
  <div class="smart-board">
    <div class="board-header">
      <span>👨‍🏫</span><span id="teacherStatus">السبورة جاهزة</span>
      <span class="online-dot" id="onlineDot"></span>
    </div>
    <div id="boardContent" class="board-content">
      <div class="welcome-msg"><h3>أهلا يا بطل! 👋</h3><p>اكتب أي كلمة فوق</p></div>
    </div>
    <div class="board-tools">
      <button onclick="speakBoard()">🔊 ترجمة فقط</button>
      <button onclick="clearBoard()">🧹 مسح</button>
    </div>
  </div>
</section>

<!-- المترجم -->
<section class="section-card">
  <h2>🌐 المترجم الفوري</h2>
  <div class="translator-card">
    <div class="trans-header">
      <select id="fromLang"><option value="ar">عربي</option><option value="en">English</option></select>
      <button id="swapBtn">🔄</button>
      <select id="toLang"><option value="en">English</option><option value="ar">عربي</option></select>
    </div>
    <textarea id="transInput" placeholder="اكتب للترجمة..."></textarea>
    <div id="transOutput" class="trans-output">الترجمة ستظهر هنا...</div>
  </div>
</section>

<!-- الألعاب -->
<section class="section-card">
  <h2>🎮 الألعاب</h2>
  <div class="game-stats">
    <span>✅ <b id="correctCount">0</b></span>
    <span>❌ <b id="wrongCount">0</b></span>
    <span>⭐ <b id="gameScore">0</b></span>
  </div>
  <div id="gameBox" class="game-box">
    <h3 id="gameQuestion">...</h3>
    <div id="gameOptions" class="game-options"></div>
  </div>
  <button class="next-btn" onclick="nextGame()">التالي ⏭️</button>
</section>

<!-- الحروف والأرقام - نفس المقاس -->
<section class="section-card">
  <h2>🔤 الحروف - اضغط لتسمع</h2>
  <div id="lettersGrid" class="letters-grid"></div>
  <h3 style="margin:16px 0 8px">🔢 الأرقام حتى 10</h3>
  <div id="numbersGrid" class="letters-grid"></div>
</section>

</main>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
</html>
