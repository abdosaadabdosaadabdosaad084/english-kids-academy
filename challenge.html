<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي النهاردة</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;text-align:center;padding:15px;margin:0}
.box{background:#fff;padding:20px;border-radius:14px;max-width:480px;margin:auto}
h1{font-size:26px}
.word{font-size:30px;font-weight:900;color:#1a6cff;direction:ltr;margin:10px}
.pron{font-size:20px;color:#d97706;font-weight:800}
.ar{font-size:19px;margin:10px}
button{width:100%;padding:14px;border:none;border-radius:12px;font-size:19px;font-weight:900;margin:6px 0;cursor:pointer}
.green{background:#16a34a;color:#fff}
.blue{background:#2563eb;color:#fff}
.orange{background:#FF9800;color:#fff}
</style>
</head>
<body>
<div class="box">
<h1>🏆 تحدي النهاردة</h1>
<div style="font-size:24px;font-weight:900">⭐ <span id="stars">0</span></div>
<div id="content"><p>جاري التحميل...</p></div>
<button class="orange" onclick="location.href='index.html'">رجوع للرئيسية</button>
</div>
<script>
let challenges=[
{word:"Hello",pron:"هيلو",ar:"أهلاً",ex:"Hello, how are you?",exAr:"أهلاً، كيف حالك؟"},
{word:"Thank you",pron:"ثانك يو",ar:"شكراً لك",ex:"Thank you very much",exAr:"شكراً جزيلاً لك"},
{word:"Water",pron:"ووتر",ar:"ماء",ex:"I drink water",exAr:"أنا أشرب الماء"},
{word:"Book",pron:"بوك",ar:"كتاب",ex:"I read a book",exAr:"أنا أقرأ كتاب"},
{word:"School",pron:"سكول",ar:"مدرسة",ex:"I go to school",exAr:"أنا أذهب للمدرسة"}
];
let day = new Date().getDate() % challenges.length;
let c = challenges[day];
let stars = localStorage.getItem('myStars') || 0;
document.getElementById('stars').innerText = stars;
document.getElementById('content').innerHTML = `
<p>كلمة النهاردة:</p>
<div class="word">${c.word}</div>
<div class="pron">${c.pron}</div>
<div class="ar">${c.ar}</div>
<hr>
<p><b>جملة:</b></p>
<div class="word" style="font-size:22px">${c.ex}</div>
<div class="ar">${c.exAr}</div>
<button class="blue" onclick="speakEn('${c.word}')">🔊 نطق الكلمة</button>
<button class="blue" onclick="speakEn('${c.ex}')">🔊 نطق الجملة</button>
<button class="green" onclick="winStar()">✅ خلصت التحدي - خد نجمة</button>
`;
function speakEn(t){ speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.75; speechSynthesis.speak(u); }
function winStar(){
  let s = parseInt(localStorage.getItem('myStars')||0)+1;
  localStorage.setItem('myStars', s);
  document.getElementById('stars').innerText = s;
  alert('مبروك! 🎉 خدت نجمة، بقى معاك ' + s + ' نجمة');
}
</script>
</body>
</html>
