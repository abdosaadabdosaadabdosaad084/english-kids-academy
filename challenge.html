<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 سؤال تحدي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0f0e2e;color:#fff;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;padding:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#1e1b4b;padding:10px;border-radius:12px;border:2px solid #facc15;margin-bottom:12px}
.topbar button{background:#facc15;border:none;padding:8px 12px;border-radius:8px;font-weight:900}
h1{text-align:center;color:#facc15}
.score{text-align:center;background:#fff;color:#111;padding:10px;border-radius:12px;font-weight:900;margin:10px 0}
.qbox{background:#fff;color:#111;border-radius:14px;padding:14px;margin-bottom:10px}
.qbox b{font-size:18px}
.qbox button{display:block;width:100%;padding:11px;margin-top:8px;border-radius:10px;border:2px solid #ddd;background:#f8fafc;font-weight:900;font-size:16px}
.qbox button.correct{background:#22c55e;color:#fff}
.qbox button.wrong{background:#ef4444;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="topbar"><button onclick="location.href='index.html'">‹ رجوع</button><span style="font-weight:900">🏆 100 سؤال تحدي</span><button onclick="location.href='index.html'">🏠</button></div>
<h1>🏆 100 سؤال - جاوب واكسب</h1>
<div class="score" id="score">النقاط: 0 / 100</div>
<div id="list"></div>
</div>
<script>
let vocab=[['Cat','قطة'],['Dog','كلب'],['Apple','تفاحة'],['Book','كتاب'],['Sun','شمس'],['Moon','قمر'],['Water','ماء'],['School','مدرسة'],['House','بيت'],['Bird','عصفور'],['Fish','سمكة'],['Lion','أسد'],['Horse','حصان'],['Flower','وردة'],['Tree','شجرة'],['Ball','كرة'],['Pen','قلم'],['Bag','شنطة'],['Door','باب'],['Car','سيارة'],['Milk','لبن'],['Bread','عيش'],['Egg','بيضة'],['Banana','موزة'],['Orange','برتقالة']];
let all=[];let wrongs=['كلب','بيت','شمس','كتاب','ماء','قمر','سمكة','أسد','وردة','شجرة'];
for(let i=0;i<100;i++){let v=vocab[i%vocab.length];let opts=[v[1],wrongs[i%wrongs.length],wrongs[(i+3)%wrongs.length]];if(opts[1]===opts[0])opts[1]='باب';if(opts[2]===opts[0])opts[2]='سيارة';all.push([`السؤال ${i+1}: What is the meaning of ${v[0]} ?`,opts[0],opts[1],opts[2],0]);}
let score=0;
document.getElementById('list').innerHTML=all.map((q,i)=>`<div class="qbox"><b>${q[0]}</b>${[q[1],q[2],q[3]].map((o,oi)=>`<button onclick="check(this,${oi},${q[4]})">${o}</button>`).join('')}</div>`).join('');
function check(btn,chosen,correct){let p=btn.parentElement;if(p.dataset.done)return;p.dataset.done='1';let btns=p.querySelectorAll('button');if(chosen===correct){btn.classList.add('correct');score++;}else{btn.classList.add('wrong');btns[correct].classList.add('correct');}document.getElementById('score').innerText=`النقاط: ${score} / 100`;}
</script>
</body>
</html>
