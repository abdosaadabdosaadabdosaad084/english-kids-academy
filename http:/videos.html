<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الفيديوهات</title>
<style>
body{background:#0f0f2a;color:white;font-family:Arial;text-align:center;margin:0;padding:16px}
a{color:white;text-decoration:none}
.top{background:#facc15;color:#111;padding:14px;border-radius:14px;font-weight:bold;display:block;margin-bottom:16px}
.card{background:white;color:#111;border-radius:16px;padding:12px;margin-bottom:16px;text-align:right}
video{width:100%;border-radius:12px;background:#000}
.back{background:#555;color:white;padding:12px;border-radius:12px;display:block;margin-top:10px}
</style>
</head>
<body>
<a class="top" href="index.html">⬅ رجوع للرئيسية</a>
<h2>🎬 الفيديوهات</h2>
<div id="list">جاري التحميل...</div>
<a class="back" href="index.html">رجوع</a>
<script>
fetch('videos.json?v='+Date.now()).then(r=>r.json()).then(data=>{
  let videos = Array.isArray(data) ? data : data.videos;
  let box=document.getElementById('list');
  box.innerHTML='';
  videos.forEach(v=>{
    let src = v.src || v.url || v.file || v.video;
    if(src && !src.includes('/')) src = 'videos/' + src;
    box.innerHTML+=`<div class="card"><h3>${v.title || 'فيديو'}</h3><video controls playsinline preload="metadata"><source src="${src}" type="video/mp4"></video></div>`;
  });
});
</script>
</body>
</html>
